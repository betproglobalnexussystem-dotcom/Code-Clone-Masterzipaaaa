<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Default SEO — overridden per-page by React SEO component -->
    <title>BetMali | Sports Betting, Live Betting & Football Odds</title>
    <meta name="description" content="BetMali is Africa's leading sports betting platform. Bet on Football, Basketball, Rugby, Tennis, Cricket, MMA and 20+ sports with live betting and competitive odds.">
    <meta name="keywords" content="sports betting africa, football betting, live betting, online betting, betmali">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="theme-color" content="#1a8a2e">
    <meta name="application-name" content="BetMali">
    <meta name="author" content="BetMali">
    <meta name="referrer" content="origin-when-cross-origin">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BetMali">
    <meta property="og:title" content="BetMali | Sports Betting, Live Betting & Football Odds">

    <meta property="og:image" content="https://betmali.site/opengraph.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta property="og:image:alt" content="BetMali Sports Betting">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@betmali">
    <meta name="twitter:creator" content="@betmali">
    <meta name="twitter:title" content="BetMali | Sports Betting, Live Betting & Football Odds">
    <meta name="twitter:description" content="Bet on Football, Basketball, Rugby, Tennis and 20+ sports at BetMali. Live odds, competitive payouts and fast payouts across Africa.">
    <meta name="twitter:image" content="https://betmali.site/opengraph.png">
    <meta name="twitter:image:alt" content="BetMali Sports Betting">

    <meta name="google-site-verification" content="REPLACE_WITH_GOOGLE_VERIFICATION_CODE">
    <meta name="msvalidate.01" content="REPLACE_WITH_BING_VERIFICATION_CODE">

    <!-- Canonical — overridden per-page -->
    <link rel="canonical" href="https://betmali.site">

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/betmali-logo.png">
    <link rel="apple-touch-icon" href="/betmali-logo.png">

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://flagcdn.com">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://www.topbet.ug">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- JSON-LD base schema — enhanced per-page by React SEO component -->
    <script type="application/ld+json" id="jsonld-base">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BetMali",
      "url": "https://betmali.site",
      "logo": {
        "@type": "ImageObject",
        "url": "https://betmali.site/logo.svg",
        "width": 200,
        "height": 60
      },
      "description": "BetMali is Africa's leading online sports betting platform offering football, basketball, rugby, tennis, cricket and 20+ sports.",
      "sameAs": [
        "https://twitter.com/betmali",
        "https://facebook.com/betmali",
        "https://instagram.com/betmali"
      ]
    }
    </script>
